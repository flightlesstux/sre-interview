kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-challenge
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
      - containerPort: 30001
        hostPort: 9090
        protocol: TCP
      - containerPort: 30002
        hostPort: 9093
        protocol: TCP
      - containerPort: 30003
        hostPort: 8080
        protocol: TCP
      - containerPort: 30004
        hostPort: 9091
        protocol: TCP
