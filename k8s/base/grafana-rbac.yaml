apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: sre-challenge
---
# The datasource sidecar watches ConfigMaps in every namespace so tenants
# can register a datasource by adding a labelled ConfigMap to their own
# namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-sidecar
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-sidecar
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: sre-challenge
