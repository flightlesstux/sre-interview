apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: sre-challenge
data:
  service-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Request Rate (by service)",
          "type": "timeseries",
          "targets": [ { "expr": "sum(rate(service_request_total[5m])) by (exported_service)", "legendFormat": "{{exported_service}}" } ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 80 } ] }
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Request Rate (by team)",
          "type": "timeseries",
          "targets": [ { "expr": "sum(rate(service_request_total[5m])) by (team)", "legendFormat": "{{team}}" } ]
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["sre-challenge"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Service Overview - SRE Challenge",
      "uid": "sre-challenge",
      "version": 1
    }
