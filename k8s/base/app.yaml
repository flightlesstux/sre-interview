apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-service
  namespace: sre-challenge
  labels:
    app: mock-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-service
  template:
    metadata:
      labels:
        app: mock-service
    spec:
      containers:
        - name: app
          image: mock-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-service
  namespace: sre-challenge
  labels:
    app: mock-service
spec:
  type: NodePort
  selector:
    app: mock-service
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      nodePort: 30003
