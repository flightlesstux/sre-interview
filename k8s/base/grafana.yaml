apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sre-challenge
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      # Populate the datasource directory before Grafana starts so the
      # first boot already sees every tenant. The long-running sidecar
      # below handles tenants added later.
      initContainers:
        - name: datasource-init
          image: kiwigrid/k8s-sidecar:1.26.1
          env:
            - name: LABEL
              value: grafana_datasource
            - name: LABEL_VALUE
              value: "1"
            - name: FOLDER
              value: /etc/grafana/provisioning/datasources
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: configmap
            - name: METHOD
              value: LIST
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 200Mi
      containers:
        - name: grafana
          image: grafana/grafana:10.4.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # Collects ConfigMaps labelled grafana_datasource=1 from all
        # namespaces into the shared datasources directory and asks Grafana
        # to reload provisioning after every change.
        - name: datasource-sidecar
          image: kiwigrid/k8s-sidecar:1.26.1
          env:
            - name: LABEL
              value: grafana_datasource
            - name: LABEL_VALUE
              value: "1"
            - name: FOLDER
              value: /etc/grafana/provisioning/datasources
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: configmap
            - name: METHOD
              value: WATCH
            - name: REQ_URL
              value: http://localhost:3000/api/admin/provisioning/datasources/reload
            - name: REQ_METHOD
              value: POST
            - name: REQ_USERNAME
              value: admin
            - name: REQ_PASSWORD
              value: admin
            # Grafana may still be booting when the first reload fires.
            - name: REQ_RETRY_TOTAL
              value: "10"
            - name: REQ_RETRY_CONNECT
              value: "10"
            - name: REQ_RETRY_BACKOFF_FACTOR
              value: "1.5"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 200Mi
      volumes:
        - name: datasources
          emptyDir: {}
        - name: grafana-dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sre-challenge
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
