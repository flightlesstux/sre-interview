apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-alertmanager
  namespace: sre-challenge
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: platform-oncall
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      # Replace with a real pager (PagerDuty, Opsgenie, Slack) in production.
      - name: platform-oncall
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: sre-challenge
spec:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: sre-challenge
spec:
  type: NodePort
  selector:
    alertmanager: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: 9093
      nodePort: 30002
