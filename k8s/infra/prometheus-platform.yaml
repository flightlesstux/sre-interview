# Platform ("meta") Prometheus in the monitoring namespace. It watches the
# monitoring stack itself: the operator, Grafana, Alertmanager, the central
# Prometheus and every tenant Prometheus. If the central Prometheus dies,
# this one still says so.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-platform
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-platform
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-platform
subjects:
  - kind: ServiceAccount
    name: prometheus-platform
    namespace: monitoring
---
# Exposes the operator's own metrics (reconcile errors, managed resources).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operator
  namespace: monitoring
  labels:
    app: prometheus-operator
spec:
  selector:
    app: prometheus-operator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: platform
  namespace: monitoring
  labels:
    prometheus: platform
spec:
  replicas: 1
  serviceAccountName: prometheus-platform
  externalLabels:
    prometheus: platform
  # Meta-monitoring targets live in several namespaces and are marked
  # tier: meta. Nothing else is scraped by this instance.
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector:
    matchLabels:
      tier: meta
  ruleNamespaceSelector: {}
  ruleSelector:
    matchLabels:
      tier: meta
  scrapeInterval: 15s
  evaluationInterval: 15s
  enforcedSampleLimit: 5000
  enforcedLabelLimit: 20
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  retention: 24h
  retentionSize: 1GB
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
  alerting:
    alertmanagers:
      - namespace: sre-challenge
        name: alertmanager-operated
        port: web
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-platform
  namespace: monitoring
  labels:
    prometheus: platform
spec:
  type: NodePort
  selector:
    prometheus: platform
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30004
---
# Datasource for Grafana, delivered by the datasource sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-platform
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  platform.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus (platform)
        uid: prom-platform
        type: prometheus
        access: proxy
        url: http://prometheus-platform.monitoring.svc:9090
        editable: false
