# Picked up by the Grafana datasource sidecar (label grafana_datasource=1)
# from any namespace. Gives the team its own datasource in the shared
# Grafana without anyone touching the Grafana deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-bravo
  namespace: team-bravo
  labels:
    grafana_datasource: "1"
    tenant: bravo
data:
  bravo.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus (team bravo)
        uid: prom-bravo
        type: prometheus
        access: proxy
        url: http://prometheus.team-bravo.svc:9090
        editable: false
