# Picked up by the Grafana datasource sidecar (label grafana_datasource=1)
# from any namespace. Gives the team its own datasource in the shared
# Grafana without anyone touching the Grafana deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-TENANT
  namespace: team-TENANT
  labels:
    grafana_datasource: "1"
    tenant: TENANT
data:
  TENANT.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus (team TENANT)
        uid: prom-TENANT
        type: prometheus
        access: proxy
        url: http://prometheus.team-TENANT.svc:9090
        editable: false
